services:
  event-service:
    build: ./event-service
    ports:
      - "8001:8001"
    volumes:
      - event_data:/app/data

  registration-service:
    build: ./registration-service
    ports:
      - "8002:8002"
    environment:
      EVENT_SERVICE_URL: http://event-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8003
    depends_on:
      - event-service
      - notification-service
    volumes:
      - registration_data:/app/data

  notification-service:
    build: ./notification-service
    ports:
      - "8003:8003"
    volumes:
      - notification_data:/app/data

volumes:
  event_data:
  registration_data:
  notification_data:
