<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart College Event Dashboard</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px}
button{padding:10px 16px;margin:5px;cursor:pointer}
pre{background:#f4f4f4;padding:15px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Smart College Event Dashboard</h1>
<p>Start Docker Compose, then use the buttons.</p>
<h2>Service Health</h2>
<button onclick="health(8001)">Event</button>
<button onclick="health(8002)">Registration</button>
<button onclick="health(8003)">Notification</button>
<pre id="health">Click a button.</pre>
<h2>Events</h2>
<button onclick="loadEvents()">Load Events</button>
<pre id="events">No data loaded.</pre>
<script>
async function health(port){
  const r=await fetch('http://localhost:'+port+'/health');
  document.getElementById('health').textContent=await r.text();
}
async function loadEvents(){
  const r=await fetch('http://localhost:8001/events');
  document.getElementById('events').textContent=await r.text();
}
</script>
</body>
</html>
