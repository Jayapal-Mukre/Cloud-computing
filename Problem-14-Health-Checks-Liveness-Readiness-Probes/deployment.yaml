apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-probe-app
  namespace: probe-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-probe-app
  template:
    metadata:
      labels:
        app: health-probe-app
    spec:
      containers:
        - name: health-app
          image: health-probe-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          # Checks whether the application is alive.
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Checks whether the application can receive traffic.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
